<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เว็บไซต์หน่วยงานของฉัน</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      margin: 0;
      background: #f0f4f8;
      color: #243447;
      line-height: 1.8;
    }
    header {
      background: #124b83;
      color: white;
      text-align: center;
      padding: 35px 15px;
    }
    main {
      max-width: 850px;
      margin: 25px auto;
      padding: 20px;
    }
    section {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 12px;
    }
    h2 { color: #124b83; }
    footer {
      text-align: center;
      padding: 20px;
      background: #dce6f0;
    }
  </style>
</head>
<body>
  <header>
    <h1>เว็บไซต์หน่วยงานของฉัน</h1>
    <p>มุ่งมั่นให้บริการด้วยความโปร่งใสและมีประสิทธิภาพ</p>
  </header>

  <main>
    <section>
      <h2>เกี่ยวกับหน่วยงาน</h2>
      <p>แนะนำภารกิจ หน้าที่ และการให้บริการของหน่วยงาน</p>
    </section>

    <section>
      <h2>ข่าวประชาสัมพันธ์</h2>
      <p>ติดตามข่าวสารและประกาศสำคัญของหน่วยงาน</p>
    </section>

    <section>
      <h2>บริการประชาชน</h2>
      <p>รวบรวมข้อมูลและช่องทางติดต่อสำหรับผู้รับบริการ</p>
    </section>

  </main>

  <footer>
    © 2026 เว็บไซต์หน่วยงานของฉัน
  </footer>
</body>
</html>
